name: Deploy to Firebase

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
        paths:
            - 'frontend/package.json'
            - 'frontend/bun.lock'
            - 'frontend/web/**'
            - 'frontend/shared/**'
            - '.github/workflows/deploy.yml'

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Restore Bun cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              working-directory: frontend
              run: bun install --frozen-lockfile

            - name: Restore Firebase CLI
              id: cache-firebase
              uses: actions/cache@v4
              with:
                  path: ~/.cache/firebase-bin
                  key: ${{ runner.os }}-firebase-cli-v15.33.0

            - name: Install Firebase CLI
              if: steps.cache-firebase.outputs.cache-hit != 'true'
              run: |
                  mkdir -p ~/.cache/firebase-bin
                  curl -sL --fail https://firebase.tools/bin/linux/v15.33.0 -o ~/.cache/firebase-bin/firebase
                  chmod +x ~/.cache/firebase-bin/firebase

            - name: Add Firebase CLI to PATH
              run: echo "$HOME/.cache/firebase-bin" >> $GITHUB_PATH

            - name: Create .env
              working-directory: frontend/web
              env:
                  ENV_CONTENT: ${{ github.ref == 'refs/heads/main' && secrets.ENV_PROD || secrets.ENV_DEV }}
              run: echo "$ENV_CONTENT" > .env

            - name: Build frontend bundle
              working-directory: frontend/web
              run: bun run build

            - name: Deploy to Firebase Hosting
              working-directory: frontend/web
              env:
                  FIREBASE_SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_BROADTRACK || secrets.FIREBASE_SERVICE_ACCOUNT_BROADTRACK_DEV }}
                  PROJECT_ID: ${{ github.ref == 'refs/heads/main' && 'broadtrack' || 'broadtrack-dev' }}
              run: |
                  echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
                  GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only hosting --project "$PROJECT_ID"
                  rm -f /tmp/sa.json
