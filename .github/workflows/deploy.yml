name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_BROADTRACK || secrets.FIREBASE_SERVICE_ACCOUNT_BROADTRACK_DEV }}
          channelId: live
          projectId: ${{ github.ref == 'refs/heads/main' && 'broadtrack' || 'broadtrack-dev' }}
          entryPoint: frontend
