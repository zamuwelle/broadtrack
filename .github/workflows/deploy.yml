name: Deploy to Firebase

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
        paths:
            - 'frontend/package.json'
            - 'frontend/bun.lock'
            - 'frontend/web/**'
            - 'frontend/shared/**'
            - '.github/scripts/shared/build-frontend.sh'
            - '.github/scripts/deploy/deploy-firebase.sh'
            - '.github/workflows/deploy.yml'

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            statuses: read
        outputs:
            verified: ${{ steps.verify.outputs.verified }}
        steps:
            - uses: actions/checkout@v4
            - name: Check for tests on this commit
              id: verify
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: bash .github/scripts/deploy/find-verified-tests.sh

    tests:
        needs: verify
        if: needs.verify.outputs.verified != 'true'
        uses: ./.github/workflows/tests.yml

    deploy:
        needs: [verify, tests]
        if: always() && needs.verify.result == 'success' && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && needs.verify.outputs.verified == 'true'))
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Restore Bun cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              working-directory: frontend
              run: bun install --frozen-lockfile

            - name: Restore Firebase CLI
              id: cache-firebase
              uses: actions/cache@v4
              with:
                  path: ~/.cache/firebase-bin
                  key: ${{ runner.os }}-firebase-cli-v15.33.0

            - name: Install Firebase CLI
              if: steps.cache-firebase.outputs.cache-hit != 'true'
              run: bash .github/scripts/deploy/install-firebase-cli.sh

            - name: Add Firebase CLI to PATH
              run: echo "$HOME/.cache/firebase-bin" >> $GITHUB_PATH

            - name: Create .env
              env:
                  ENV_CONTENT: ${{ github.ref == 'refs/heads/main' && secrets.ENV_PROD || secrets.ENV_DEV }}
              run: bash .github/scripts/deploy/write-frontend-env.sh

            - name: Build frontend bundle
              run: bash .github/scripts/shared/build-frontend.sh

            - name: Deploy to Firebase Hosting
              env:
                  FIREBASE_SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_BROADTRACK || secrets.FIREBASE_SERVICE_ACCOUNT_BROADTRACK_DEV }}
                  PROJECT_ID: ${{ github.ref == 'refs/heads/main' && 'broadtrack' || 'broadtrack-dev' }}
              run: bash .github/scripts/deploy/deploy-firebase.sh
